<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/styles-carrito.css">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="icon" href="/frontend/assets/img/rsz_2dreamina-2026-06-19-4111-proyecto_sin_no.png" type="image/x-icon">

    <title>Mizuta-Carrito</title>
</head>
<body>
    <nav id="navbar">
        <div class="navbar-name-logo">
            <img src="/frontend/assets/img/rsz_2dreamina-2026-06-19-4111-proyecto_sin_no.png" alt="img-logo">
            <span href="#">Mizuta</span>
        </div>
        <p class="info-navbar">Programación III | UTN Avellaneda</p>
        <div>
            <button class="nav-theme-button">☀️</button>
            <button class="nav-admin-button">⚙️ Admin</button>
        </div> 
    </nav>

    <main>
        <div class="page-container">
            <div class="cart-container">
                <div class="div-header">
                    <button class="btn-seguir-comprando">← Seguir comprando</button>
                    <h1 class="cart-title">🛒 Tu carrito</h1>
                </div> 
                <div class="info-carrito">
                    <h2 class="info-header">Resumen del carrito</h2>
                    <div id="cart-products">
                        <table class="table">
                            <tr class="table-header">
                                <td class="indicator">Producto</td>
                                <td class="indicator">Cantidad</td>
                                <td class="indicator">Valor</td>
                            </tr>
                        </table>
                        <h2 class="total-amount" id="valor-final">Total</h2>
                        <div class="contenedor-limpiar">
                            <button class="btn-limpiar-carrito">Limpiar Carrito</button>
                        </div>
                        

                    </div>
                </div> 
            </div>
        </div>
    </main>
    <script src="./carrito.js"></script>
</body>
</html>
