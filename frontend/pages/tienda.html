<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="stylesheet" href="/frontend/css/shop.css">
    <link rel="icon" " href="/frontend/assets/img/rsz_2dreamina-2026-06-19-4111-proyecto_sin_no.png">
    <title>Mizuta Shop</title>
</head>
<body>
    <nav id="navbar">
        <div class="navbar-name-logo">
            <img src="/frontend/assets/img/rsz_2dreamina-2026-06-19-4111-proyecto_sin_no.png" alt="img-logo" href="#">
            <span href="#">Mizuta</span>
        </div>
        <p class="info-navbar">Programación III | UTN Avellaneda</p>
        <div>
            <button class="nav-theme-button">Theme</button>
            <button class="nav-admin-button">⚙️ Admin</button>
        </div> 
    </nav>
    <main>
        <div class="shop-container">
            <div class="shop-header">
                <div class="shop-welcome">
                    <h1>Hola, 
                        <span class="client-name"></span>
                    </h1>
                    <p>Elegí tus productos favoritos y armá tu carrito.</p>
                </div>
                <button class="shop-cart-button">🛒 Ver carrito</button>
            </div>
            <div>
                <button>Todos</button>
                <button>Videojuegos</button>
                <button>Hardware</button>
            </div>
            <div>
                <span>🔍</span>
                <input type="text" placeholder="Buscar producto...">
            </div>

            <div class="load-products-buttons">
                <button>‹ Anterior</button>
                <div>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                </div>
                <button>Siguiente ›</button>
            </div>
        </div>
    </main>
</body>
</html>
